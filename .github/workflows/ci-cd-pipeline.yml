name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: hamna-voting-app-cluster
  DOCKERHUB_USERNAME: hamnairfan96

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push vote image
        uses: docker/build-push-action@v5
        with:
          context: ./vote
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/voting-app:latest

      - name: Build and push result image
        uses: docker/build-push-action@v5
        with:
          context: ./result
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/result-app:latest

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/worker-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Create/update db-credentials Secret
        run: |
          kubectl create secret generic db-credentials \
            --from-literal=POSTGRES_USER="${{ secrets.DB_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=POSTGRES_DB="${{ secrets.DB_NAME }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/postgress.yaml
          kubectl apply -f k8s/vote.yaml
          kubectl apply -f k8s/result.yaml
          kubectl apply -f k8s/worker.yaml
          kubectl apply -f k8s/ingress-vote.yaml
          kubectl apply -f k8s/ingress-result.yaml

      - name: Restart deployments to pull new images
        run: |
          kubectl rollout restart deployment/vote-deployment
          kubectl rollout restart deployment/result-deployment
          kubectl rollout restart deployment/worker-deployment
